<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Match — your move</title>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&amp;family=Lilita+One&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#a585ff}a:hover{color:#c7b3ff}
.cell{background:#291b4a;border:0;border-radius:14px;box-shadow:0 4px 0 #0b0616;display:grid;place-items:center;font-family:'Lilita One',sans-serif;font-size:64px;line-height:1;color:#f5f0ff;min-height:44px}
.x{color:#38d6ff}.o{color:#ff9f3a}
.fade{opacity:.35;outline:2px dashed currentColor;outline-offset:-8px}
.pc{display:flex;align-items:center;gap:12px;background:#1c1233;border-radius:22px;padding:12px}
.av{width:44px;height:44px;border-radius:999px;background:#291b4a;display:grid;place-items:center;font-family:'Lilita One',sans-serif;font-size:20px}
.clk{font-family:'Chakra Petch',monospace;font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums;padding:8px 14px;border-radius:999px}
.ib{width:48px;height:48px;border-radius:14px;border:2px solid #8a74c9;background:#1c1233;box-shadow:0 4px 0 #0b0616;color:#f5f0ff;display:grid;place-items:center}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #120a22; color: #f5f0ff; font-family: Nunito, system-ui, sans-serif; font-weight: 600; display: flex; flex-direction: column; gap: 16px; padding: 20px 16px 28px">
  <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #b9aadb">
    <span style="font-weight: 800; letter-spacing: .06em; text-transform: uppercase">Ranked · Sudden death</span>
    <span style="font-family: 'Chakra Petch', monospace">Game 0:41 · move 15s</span>
  </div>
  <div class="pc">
    <div class="av">K</div>
    <div style="flex: 1; min-width: 0"><div style="font-weight: 800; font-size: 15px">kestrel_99 <span style="color: #ff9f3a">O</span></div><div style="font-size: 13px; color: #b9aadb">Gold I · 1562 · 48ms</div></div>
    <div class="clk" style="border: 3px solid #ff9f3a; opacity: .55">0:15</div>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px">
    <div style="position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; background: #1c1233; border-radius: 22px; padding: 14px; width: 340px; height: 340px; box-sizing: border-box">
      <button class="cell x" aria-label="X">X</button>
      <button class="cell" aria-label="Empty cell"></button>
      <button class="cell o fade" aria-label="O, vanishes next">O</button>
      <button class="cell o" aria-label="O">O</button>
      <button class="cell o" aria-label="O">O</button>
      <button class="cell x" aria-label="X">X</button>
      <button class="cell" aria-label="Empty cell"></button>
      <button class="cell x" aria-label="X">X</button>
      <button class="cell o" aria-label="O">O</button>
    </div>
    <div style="font-size: 14px; color: #b9aadb">Faded <span style="color: #ff9f3a">O</span> vanishes when you place</div>
  </div>
  <div class="pc" style="outline: 2px solid #38d6ff">
    <div class="av">A</div>
    <div style="flex: 1; min-width: 0"><div style="font-weight: 800; font-size: 15px">You <span style="color: #38d6ff">X</span></div><div style="font-size: 13px; color: #4fe08a">Your move</div></div>
    <div class="clk" style="border: 3px solid #38d6ff">0:11</div>
  </div>
  <div style="display: flex; gap: 12px; justify-content: center">
    <button class="ib" aria-label="Emotes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5c1 1.3 2.1 2 3.5 2s2.5-.7 3.5-2M9 9.5h.01M15 9.5h.01"/></svg></button>
    <button class="ib" aria-label="Resign"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg></button>
    <button class="ib" aria-label="More"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg></button>
  </div>
</div>
</x-dc>
