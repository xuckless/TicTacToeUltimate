name: server
on:
  push:
    branches: [main]
    paths: ['TicTacToeUltimate.Server/**', 'TicTacToeUltimate.Engine/**', 'TicTacToeUltimate.Contracts/**', 'tests/TicTacToeUltimate.Server*/**', 'tests/TicTacToeUltimate.Engine.Tests/**', 'Directory.*.props', 'global.json', 'supabase/migrations/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['TicTacToeUltimate.Server/**', 'TicTacToeUltimate.Engine/**', 'TicTacToeUltimate.Contracts/**', 'tests/**', 'Directory.*.props', 'global.json', '.github/workflows/server.yml']
  workflow_dispatch:
permissions: { contents: read, packages: write }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - run: dotnet test tests/TicTacToeUltimate.Engine.Tests
      - run: dotnet test tests/TicTacToeUltimate.Server.Tests
      - run: dotnet test tests/TicTacToeUltimate.Server.IntegrationTests
  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: TicTacToeUltimate.Server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ttt-server:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/ttt-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
