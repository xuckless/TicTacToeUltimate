name: bots
on:
  push:
    branches: [main]
    paths: ['bots/**', 'spec/rules/vectors/**', '.github/workflows/bots.yml']
  pull_request:
    paths: ['bots/**', 'spec/rules/vectors/**', '.github/workflows/bots.yml']
  workflow_dispatch:
permissions: { contents: read, packages: write }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: bots } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: bots/go.mod, cache-dependency-path: bots/go.sum }
      - run: go vet ./...
      - run: go test ./...
  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: bots/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/ttt-bots:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/ttt-bots:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
